<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModelBenchLab — AI 模型 3D 场景对比</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 1.5rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 3rem;
    }
    .section-title {
      font-size: 1.2rem;
      font-weight: 500;
      color: #aaa;
      margin: 2rem 0 1rem;
      width: 100%;
      max-width: 1200px;
      border-bottom: 1px solid #2a2a35;
      padding-bottom: 0.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 1200px;
    }
    .card {
      background: #16161e;
      border: 1px solid #2a2a35;
      border-radius: 12px;
      padding: 1.5rem;
      transition: border-color 0.2s, transform 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .card:hover {
      border-color: #60a5fa;
      transform: translateY(-2px);
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 500;
    }
    .badge-model { background: #1e293b; color: #93c5fd; }
    .badge-api { background: #1a2e1a; color: #86efac; }
    .badge-api.webgl { background: #2e2a1a; color: #fcd34d; }
    .card-title {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    .card-desc {
      font-size: 0.85rem;
      color: #888;
      line-height: 1.5;
    }
    .card-tech {
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid #2a2a35;
      font-size: 0.75rem;
      color: #666;
    }
    .path {
      float: right;
      color: #60a5fa;
      font-family: monospace;
    }
    .error {
      color: #f87171;
      font-size: 0.9rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <h1>ModelBenchLab</h1>
  <p class="subtitle">不同 AI 模型生成的 3D 场景对比测试 — 卡片由 benchmark/registry.json 动态生成</p>
  <main id="portal" style="display:contents"></main>

  <script type="module">
    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };

    function card(p) {
      const a = el('a', 'card');
      a.href = `./${p.dir}/`;
      a.target = '_blank';

      const head = el('div', 'card-header');
      head.append(el('span', 'badge badge-model', p.model));
      head.append(el('span', p.api === 'WebGPU' ? 'badge badge-api' : 'badge badge-api webgl', p.api));
      a.append(head);

      a.append(el('div', 'card-title', p.title));
      a.append(el('div', 'card-desc', p.desc));

      const tech = el('div', 'card-tech');
      const parts = [];
      if (p.three) parts.push(`Three.js ${p.three}`);
      if (p.vite) parts.push(`Vite ${p.vite}`);
      if (p.framework) parts.push(p.framework);
      if (p.lang) parts.push(p.lang);
      tech.textContent = parts.join(' · ');
      tech.append(el('span', 'path', `/${p.dir}/`));
      a.append(tech);
      return a;
    }

    try {
      const reg = await (await fetch('./benchmark/registry.json')).json();
      const portal = document.getElementById('portal');
      const rendered = new Set();

      for (const sec of reg.portalSections || []) {
        const missions = sec.missions || [sec.id];
        const items = reg.projects.filter((p) => missions.includes(p.mission));
        if (!items.length) continue;
        portal.append(el('h2', 'section-title', sec.label));
        const grid = el('div', 'grid');
        for (const p of items) { grid.append(card(p)); rendered.add(p.dir); }
        portal.append(grid);
      }

      const rest = reg.projects.filter((p) => !rendered.has(p.dir));
      if (rest.length) {
        portal.append(el('h2', 'section-title', 'Other — 未分区'));
        const grid = el('div', 'grid');
        for (const p of rest) grid.append(card(p));
        portal.append(grid);
      }
      document.title = `${reg.portalTitle || 'ModelBenchLab'} — AI 模型 3D 场景对比(${reg.projects.length} 项目)`;
    } catch (e) {
      document.getElementById('portal').append(el('p', 'error', '加载 benchmark/registry.json 失败: ' + e.message));
    }
  </script>
</body>
</html>
