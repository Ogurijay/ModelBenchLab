<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>像素大亨 — 商业模拟养成</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1020; --panel: #171b30; --panel2: #1e2340; --line: #2c3358;
    --text: #dfe3f2; --dim: #8a90ad; --gold: #ffd54a; --green: #5fc46a; --red: #e05555;
    --blue: #5fb3ff; --shadow: #05060d;
  }
  html { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100%;
    background-image: radial-gradient(circle at 20% 0%, #1a2040 0%, var(--bg) 55%);
    font-size: 13px; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  /* ---- 像素风元件 ---- */
  .px { border: 2px solid #000; box-shadow: 0 0 0 2px var(--line) inset, 0 3px 0 var(--shadow); image-rendering: pixelated; }
  button { font-family: inherit; cursor: pointer; }
  .btn {
    display: block; width: 100%; margin-top: 6px; padding: 6px 8px;
    background: var(--panel2); color: var(--text); border: 2px solid #000;
    box-shadow: 0 0 0 1px var(--line) inset, 0 2px 0 var(--shadow);
    font-size: 12px; font-weight: 600; letter-spacing: 1px;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.2); }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 0 0 1px var(--line) inset; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.gold { background: #6b5417; color: #ffe9a3; box-shadow: 0 0 0 1px #a8842f inset, 0 2px 0 var(--shadow); }
  .btn.danger { background: #4a1e1e; color: #ffb3b3; box-shadow: 0 0 0 1px #8a3535 inset, 0 2px 0 var(--shadow); }
  .btn.sm { display: inline-block; width: auto; padding: 3px 8px; margin: 2px 2px 0 0; font-size: 11px; }
  .btn.big { padding: 9px 8px; font-size: 13px; }

  /* ---- 顶栏 ---- */
  #topbar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    padding: 8px 12px; background: var(--panel);
    border-bottom: 3px solid #000; box-shadow: 0 3px 0 rgba(255,255,255,.04);
    position: sticky; top: 0; z-index: 30;
  }
  .logo {
    font-size: 17px; font-weight: 900; letter-spacing: 3px; padding-right: 8px;
    background: linear-gradient(180deg, #ffe9a3, #e8a52f);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 3px 0 rgba(0,0,0,.55);
  }
  .chip {
    display: flex; align-items: center; gap: 5px; padding: 3px 8px;
    background: var(--panel2); border: 2px solid #000;
    box-shadow: 0 0 0 1px var(--line) inset; font-size: 12px;
  }
  .chip .lab { color: var(--dim); font-size: 11px; }
  .chipv { font-weight: 700; font-variant-numeric: tabular-nums; }
  .chipv.red { color: var(--red); } .chipv.green { color: var(--green); }
  .xpwrap { width: 64px; height: 8px; background: #0a0c18; border: 1px solid #000; }
  #xpbar { display: block; height: 100%; background: linear-gradient(90deg, #5fb3ff, #8a5ac9); }
  .spd { width: 34px; padding: 3px 0; background: var(--panel2); color: var(--dim); border: 2px solid #000; box-shadow: 0 0 0 1px var(--line) inset; font-weight: 700; }
  .spd.on { background: #234a26; color: #9df0a5; box-shadow: 0 0 0 1px #3f7d46 inset; }
  .tbtn { padding: 3px 9px; background: var(--panel2); color: var(--text); border: 2px solid #000; box-shadow: 0 0 0 1px var(--line) inset; font-size: 12px; }
  .tbtn:hover { filter: brightness(1.25); }

  /* ---- 主布局 ---- */
  #main { display: flex; gap: 10px; padding: 10px; align-items: flex-start; max-width: 1420px; margin: 0 auto; }
  #left { flex: 1 1 auto; min-width: 0; }
  #panel {
    flex: 0 0 390px; max-width: 390px; background: var(--panel);
    border: 2px solid #000; box-shadow: 0 0 0 2px var(--line) inset, 0 4px 0 var(--shadow);
    display: flex; flex-direction: column; max-height: calc(100vh - 76px); position: sticky; top: 60px;
  }

  /* 城区页签 */
  #distTabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .dtab {
    flex: 1 1 100px; text-align: left; padding: 4px 8px;
    background: var(--panel); color: var(--text); border: 2px solid #000;
    box-shadow: 0 0 0 1px var(--line) inset, 0 2px 0 var(--shadow);
  }
  .dtab .dname { font-weight: 700; font-size: 12px; display: block; }
  .dtab .dsub { color: var(--dim); font-size: 10px; }
  .dtab.on { background: #2a3158; box-shadow: 0 0 0 1px var(--gold) inset, 0 2px 0 var(--shadow); }
  .dtab.locked { opacity: .55; }
  .dtab:hover:not(.locked) { filter: brightness(1.15); }

  #canvasWrap { position: relative; border: 3px solid #000; box-shadow: 0 0 0 2px var(--line) inset, 0 5px 0 var(--shadow); background: #000; overflow: hidden; text-align: center; }
  #city { display: inline-block; image-rendering: pixelated; image-rendering: crisp-edges; vertical-align: top; cursor: pointer; }
  #tip {
    position: absolute; display: none; pointer-events: none; z-index: 20;
    background: rgba(10,12,24,.94); border: 2px solid #000; box-shadow: 0 0 0 1px var(--line) inset;
    padding: 5px 8px; font-size: 11px; line-height: 1.5; text-align: left; max-width: 170px;
  }
  #under { margin-top: 6px; color: var(--dim); font-size: 11px; line-height: 1.5; }

  /* 面板页签 */
  .ptabs { display: flex; flex-wrap: wrap; border-bottom: 2px solid #000; }
  .ptab {
    flex: 1 1 auto; padding: 7px 2px; font-size: 12px; font-weight: 700; letter-spacing: 1px;
    background: var(--panel); color: var(--dim); border: none; border-right: 1px solid #000;
  }
  .ptab.on { background: var(--panel2); color: var(--gold); box-shadow: 0 -2px 0 var(--gold) inset; }
  #tabContent { overflow-y: auto; padding: 8px; flex: 1; }
  #tabContent::-webkit-scrollbar { width: 8px; }
  #tabContent::-webkit-scrollbar-thumb { background: var(--line); border: 2px solid var(--panel); }

  /* ---- 卡片与通用 ---- */
  .card {
    background: var(--panel2); border: 2px solid #000;
    box-shadow: 0 0 0 1px var(--line) inset, 0 3px 0 var(--shadow);
    padding: 8px 9px; margin-bottom: 8px;
  }
  .card.gold-b { box-shadow: 0 0 0 1px #a8842f inset, 0 3px 0 var(--shadow); }
  .card h3 { font-size: 13px; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .card h3 .ico { width: 16px; height: 16px; }
  .kv { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 2px 8px; font-size: 12px; margin: 3px 0; }
  .kv span { color: var(--dim); } .kv b { font-variant-numeric: tabular-nums; }
  .row { padding: 3px 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .row.click { cursor: pointer; } .row.click:hover { background: rgba(255,255,255,.05); }
  .right { margin-left: auto; text-align: right; }
  .green { color: var(--green); } .red { color: var(--red); } .dim { color: var(--dim); }
  .warn { color: #e8b93f; }
  .small { font-size: 11px; line-height: 1.5; } .big { font-size: 15px; }
  .block { display: block; } .pad { padding: 8px 2px; } .mt { margin-top: 8px; }
  .lv { color: var(--gold); font-size: 11px; }
  .ico { width: 14px; height: 14px; image-rendering: pixelated; }

  table.pl { width: 100%; border-collapse: collapse; font-size: 12px; margin: 4px 0; }
  table.pl td { padding: 2px 4px; border-bottom: 1px dashed #2a3055; font-variant-numeric: tabular-nums; }
  table.pl tr.sum td { border-bottom: none; font-weight: 800; font-size: 13px; padding-top: 4px; }

  .fchips { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
  .fchip { font-size: 10px; padding: 1px 5px; background: #10132a; border: 1px solid var(--line); color: var(--dim); }
  .fchip.up { color: #9df0a5; } .fchip.dn { color: #ff9d9d; }

  .srow { display: flex; align-items: center; gap: 8px; margin: 6px 0 2px; flex-wrap: wrap; }
  .srow > span { min-width: 52px; color: var(--dim); font-size: 12px; }
  .srow input[type=range] { flex: 1; accent-color: var(--gold); min-width: 110px; }
  .seg { display: flex; flex-wrap: wrap; gap: 0; }
  .seg button {
    padding: 3px 8px; font-size: 11px; background: #10132a; color: var(--dim);
    border: 1px solid var(--line); border-right: none;
  }
  .seg button:last-child { border-right: 1px solid var(--line); }
  .seg button.on { background: #2f3a68; color: #fff; font-weight: 700; }
  .seg button.lock { opacity: .5; }
  .seg.wide button { padding: 5px 10px; }
  .seg button:hover { filter: brightness(1.3); }

  .meter { display: flex; align-items: center; gap: 6px; margin: 4px 0; font-size: 11px; }
  .meter span { min-width: 40px; color: var(--dim); }
  .meter b { min-width: 26px; text-align: right; }
  .bar { flex: 1; height: 9px; background: #0a0c18; border: 1px solid #000; box-shadow: 0 0 0 1px #222848 inset; }
  .bar i { display: block; height: 100%; background: var(--blue); }
  .bar.big { height: 13px; margin: 4px 0; }

  /* 图鉴 */
  .card.sticky { position: sticky; top: 0; z-index: 5; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; margin: 5px 0; }
  .chip.on { background: #2f3a68; color: #fff; }
  .chip.lock { opacity: .55; }
  button.chip { font-size: 11px; }
  #catQ {
    width: 100%; padding: 5px 8px; margin-top: 4px; font-family: inherit; font-size: 12px;
    background: #10132a; border: 2px solid #000; box-shadow: 0 0 0 1px var(--line) inset; color: var(--text);
  }
  #catQ:focus { outline: none; box-shadow: 0 0 0 1px var(--gold) inset; }
  .tlist { display: flex; flex-direction: column; gap: 5px; }
  .trow {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    background: var(--panel2); border: 2px solid #000; box-shadow: 0 0 0 1px var(--line) inset;
  }
  .trow.locked { opacity: .6; }
  .trow .ico { width: 18px; height: 18px; }
  .tmain { flex: 1; min-width: 0; }
  .stars { color: var(--gold); font-size: 10px; margin-left: 4px; }
  .own { font-size: 10px; color: #9df0a5; margin-left: 5px; }
  .lockwhy { font-size: 10px; color: var(--dim); max-width: 92px; text-align: right; }
  .tag { display: inline-block; font-size: 10px; padding: 0 4px; margin: 2px 2px 0 0; background: #10132a; border: 1px solid var(--line); color: var(--dim); }
  .tag.mk { color: #9df0a5; border-color: #3f7d46; }
  .tag.nd { color: #9ad1ff; border-color: #33547d; }

  /* 科技 */
  .techgrid { display: flex; flex-direction: column; gap: 5px; }
  .tech { padding: 6px 8px; background: #141833; border: 1px solid var(--line); font-size: 12px; }
  .tech b { font-size: 12px; }
  .tech .right { float: right; color: var(--dim); font-size: 11px; }
  .tech.done { border-color: #3f7d46; background: #14231a; }
  .tech.doing { border-color: var(--gold); }
  .tech.locked { opacity: .55; }

  /* 股票 */
  .stock { border-bottom: 1px dashed #2a3055; padding: 5px 0; }
  .stock .spark { vertical-align: middle; margin-left: 4px; }

  /* 成就 */
  .achgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .ach { padding: 5px 7px; background: #141833; border: 1px solid var(--line); font-size: 11px; opacity: .6; }
  .ach.done { opacity: 1; border-color: #a8842f; background: #231e10; }

  /* 日志 */
  .loglist { max-height: 240px; overflow-y: auto; }
  .logln { font-size: 11px; padding: 2px 0; border-bottom: 1px dashed #222848; line-height: 1.5; }
  .logln.good { color: #9df0a5; } .logln.bad { color: #ff9d9d; }
  .logln.warn { color: #e8b93f; } .logln.event { color: #9ad1ff; } .logln.sys { color: var(--dim); }
  .logln .dim { margin-right: 4px; }

  /* 提示 & 弹窗 */
  #toasts { position: fixed; left: 12px; bottom: 12px; z-index: 60; display: flex; flex-direction: column; gap: 6px; }
  .toast {
    background: #14231a; color: #c9f0cd; border: 2px solid #000;
    box-shadow: 0 0 0 1px #3f7d46 inset, 0 3px 0 var(--shadow);
    padding: 7px 12px; font-size: 12px; max-width: 320px;
    animation: pop .18s ease-out; transition: opacity .4s, transform .4s;
  }
  .toast.bad { background: #2a1416; color: #ffc9c9; box-shadow: 0 0 0 1px #8a3535 inset, 0 3px 0 var(--shadow); }
  .toast.out { opacity: 0; transform: translateY(8px); }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  #modal {
    position: fixed; inset: 0; z-index: 70; display: none;
    background: rgba(5,6,13,.8); align-items: center; justify-content: center; padding: 16px;
  }
  #modal.show { display: flex; }
  #modalBox {
    width: 460px; max-width: 96vw; max-height: 86vh; overflow-y: auto;
    background: var(--panel); border: 3px solid #000;
    box-shadow: 0 0 0 2px var(--gold) inset, 0 8px 0 var(--shadow);
    padding: 16px; animation: pop .18s ease-out;
  }
  #modalBox h2 { font-size: 17px; margin-bottom: 8px; letter-spacing: 2px; }
  #modalBox h3 { font-size: 13px; margin: 10px 0 4px; color: var(--gold); }
  #modalBox p { font-size: 12px; line-height: 1.6; margin: 6px 0; }

  /* 自测徽章 */
  #selftestBadge {
    position: fixed; right: 12px; bottom: 12px; z-index: 80; display: none;
    padding: 8px 14px; font-size: 12px; font-weight: 700;
    border: 2px solid #000; box-shadow: 0 3px 0 var(--shadow);
  }

  /* 移动端 */
  @media (max-width: 1020px) {
    #main { flex-direction: column; }
    #panel { flex: 1 1 auto; max-width: none; width: 100%; position: static; max-height: none; }
    #tabContent { max-height: 60vh; }
    #city { max-width: 100%; height: auto !important; }
    .logo { width: 100%; }
  }
</style>
</head>
<body>
  <header id="topbar">
    <span class="logo">像素大亨</span>
    <span class="chip"><span class="lab">现金</span><span class="chipv" id="cash">—</span></span>
    <span class="chip"><span class="lab">净资产</span><span class="chipv" id="worth">—</span></span>
    <span class="chip"><span class="chipv" id="date">—</span></span>
    <span class="chip"><span class="lab">经济</span><span class="chipv" id="econ">—</span></span>
    <span class="chip"><span class="lab">品牌</span><span class="chipv" id="brand">0</span></span>
    <span class="chip"><span class="chipv" id="lvl">Lv1</span><span class="xpwrap"><i id="xpbar" style="width:0"></i></span></span>
    <span style="flex:1"></span>
    <button class="spd" id="spd0" title="暂停(空格)">⏸</button>
    <button class="spd on" id="spd1" title="1 秒=1 天">▶</button>
    <button class="spd" id="spd2" title="2 倍速">»</button>
    <button class="spd" id="spd3" title="4 倍速">⋙</button>
    <button class="tbtn" id="btnSave" title="手动存档">💾 存档</button>
    <button class="tbtn" id="btnHelp" title="玩法说明">❓ 玩法</button>
    <button class="tbtn" id="btnNew" title="重新开局">⟳ 新局</button>
  </header>

  <div id="main">
    <div id="left">
      <div id="distTabs"></div>
      <div id="canvasWrap">
        <canvas id="city"></canvas>
        <div id="tip"></div>
      </div>
      <div id="under">
        🖱️ 点击地块：买地 / 开店 / 管理门店 / 收购对手 · 空格暂停 · 1/2/3 调速 ·
        本作 121 种业态、15 项机制全部进入逐日结算，存档自动保留在浏览器本地。
      </div>
    </div>
    <div id="panel">
      <div class="ptabs">
        <button class="ptab on" id="tab-manage" data-tab="manage">经营</button>
        <button class="ptab" id="tab-cat" data-tab="cat">图鉴</button>
        <button class="ptab" id="tab-tech" data-tab="tech">科技</button>
        <button class="ptab" id="tab-fin" data-tab="fin">金融</button>
        <button class="ptab" id="tab-mkt" data-tab="mkt">营销</button>
        <button class="ptab" id="tab-ledger" data-tab="ledger">账本</button>
        <button class="ptab" id="tab-goal" data-tab="goal">目标</button>
      </div>
      <div id="tabContent"></div>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="modal"><div id="modalBox"></div></div>
  <div id="selftestBadge"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
