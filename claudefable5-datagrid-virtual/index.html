<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>星轨人事 · 十万行虚拟数据网格</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='5' rx='2' fill='%235b8cff'/%3E%3Crect x='3' y='13' width='26' height='5' rx='2' fill='%233ddc97'/%3E%3Crect x='3' y='21' width='26' height='5' rx='2' fill='%23f5b544'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#5b8cff" />
              <stop offset="1" stop-color="#3ddc97" />
            </linearGradient>
          </defs>
          <rect x="3" y="5" width="26" height="5" rx="2.5" fill="url(#lg)" opacity="0.95" />
          <rect x="3" y="13.5" width="19" height="5" rx="2.5" fill="url(#lg)" opacity="0.6" />
          <rect x="3" y="22" width="23" height="5" rx="2.5" fill="url(#lg)" opacity="0.35" />
        </svg>
        <div class="brand-text">
          <h1>星轨人事 · 数据中心</h1>
          <p class="brand-sub">100,000 行 · 原生 JS 虚拟滚动</p>
        </div>
      </div>

      <div class="searchbox">
        <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8" />
          <line x1="13.5" y1="13.5" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <input id="searchInput" type="search" placeholder="搜索姓名 / 部门 / 城市…（防抖 300ms）"
          aria-label="搜索姓名、部门或城市" autocomplete="off" spellcheck="false" />
        <button id="searchClear" class="icon-btn" hidden aria-label="清空搜索" title="清空搜索（Esc）">&#10005;</button>
      </div>

      <div class="topbar-right">
        <span class="chip" id="chipRows">共 100,000 行</span>
        <span class="chip chip-accent" id="chipSelected" hidden>已选 0</span>
        <button id="btnClearSel" class="btn ghost" hidden>清除选择</button>
        <button id="btnCsv" class="btn" title="导出当前筛选与排序后的全部数据">导出 CSV</button>
      </div>
    </header>

    <div class="statusline">
      <span class="hint">点击表头排序（三态） · Shift+点击 多列排序 · 拖动表头右缘调列宽（双击复位） · ↑↓ / PageUp / PageDown / Home / End 导航 · Shift/Ctrl+点击 多选 · Ctrl+A 全选 · / 聚焦搜索</span>
      <span class="opmsg" id="opMsg" aria-live="polite"></span>
    </div>

    <main id="gridRoot"></main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
