<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101828" />
  <title>无垠拓荒 · 艾泽拉斯无限 — 2D 无限世界沙盒 RPG (Claude Opus 5.5)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Cpath d='M0 3h8v5H0z' fill='%23976b4b'/%3E%3Cpath d='M0 2h8v2H0z' fill='%235cc23e'/%3E%3Cpath d='M2 5h1v1H2zM5 6h1v1H5z' fill='%236e4c34'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div id="frames">
        <div id="unitFrame" class="uframe">
          <div class="portrait"><canvas id="portrait" width="48" height="48"></canvas><span id="ufLevel" class="lvl">1</span></div>
          <div class="ufBody">
            <div id="ufName" class="ufName"></div>
            <div class="bar hp"><i id="ufHp"></i><span id="ufHpT"></span></div>
            <div class="bar res" id="ufRes1"><i></i><span></span></div>
            <div class="bar res" id="ufRes2"><i></i><span></span></div>
            <div id="ufBuffs" class="buffs"></div>
          </div>
        </div>
        <div id="targetFrame" class="uframe tframe hidden">
          <div class="ufBody">
            <div id="tfName" class="ufName"></div>
            <div class="bar hp"><i id="tfHp"></i><span id="tfHpT"></span></div>
          </div>
        </div>
      </div>
      <div id="questTracker"></div>
      <div id="rightCol">
        <div id="info">
          <canvas id="dial" width="128" height="68"></canvas>
          <div id="infoLines"></div>
        </div>
        <canvas id="minimap" width="200" height="150"></canvas>
      </div>
      <div id="bottom">
        <div id="bars">
          <div class="barRow" id="armorRow"></div>
          <div class="barRow"><div id="hearts"></div><div id="food"></div></div>
          <div class="barRow" id="airRow"></div>
        </div>
        <div id="heldName"></div>
        <div id="actionBar"></div>
        <div id="hotbar"></div>
      </div>
      <div id="xpBar"><i id="xpFill"></i><span id="xpText"></span></div>
      <div id="log"></div>
      <div id="chatBox" class="hidden"><input id="chatInput" maxlength="120" autocomplete="off" placeholder="输入指令,如 /time set night、/help" /></div>
      <div id="fps"></div>
      <div id="hint"></div>
    </div>

    <div id="panelWrap" class="hidden">
      <div id="panel"></div>
    </div>
    <div id="mapView" class="hidden"><canvas id="mapCanvas"></canvas><div id="mapInfo"></div></div>
    <div id="menu" class="hidden"></div>
    <div id="cursorItem"></div>
    <div id="tooltip" class="hidden"></div>
    <div id="loading" class="hidden"><div class="ld-box"><div class="ld-title">正在生成世界…</div><div class="ld-bar"><i id="ldFill"></i></div></div></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
