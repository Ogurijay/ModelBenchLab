<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>暴风城还原 — 英雄谷、运河街区与可进入的每一栋房子 (Claude Opus 5.5)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 2h12v7c0 3-3 5-6 6-3-1-6-3-6-6z' fill='%23233f8f'/%3E%3Ccircle cx='8' cy='7' r='3' fill='%23e6b93d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud" data-ui>
    <div id="hud-where">英雄谷</div>
    <div id="hud-sub"><span id="hud-clock">15:30</span> · <span id="hud-mode">第一人称</span></div>
  </div>
  <pre id="hud-stats" data-ui></pre>
  <div id="crosshair" data-ui></div>

  <div id="help" data-ui>
    <b>操作</b>　WASD 移动 · 鼠标 视角 · 空格 跳跃 · Shift 奔跑 · F 飞行<br />
    V 第一人称 / 俯瞰 · T 自动巡游 · R 昼夜流转 · H 隐藏说明
  </div>

  <div id="enter" data-ui>
    <div class="card">
      <h1>暴风城</h1>
      <p>你站在英雄谷的大桥上，城门在身后。<br />每一扇门都能推开走进去。</p>
      <button>点击进入</button>
      <small>V 键切到俯瞰全景 · T 键自动巡游</small>
    </div>
  </div>

  <div id="loading"><div id="loading-text">正在铺设城市地基…</div></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
