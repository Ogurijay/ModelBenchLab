<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1a3a" />
  <title>像素人生 · 绿钻镇 — GBA 模拟人生复刻 (Claude Opus 5.5)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Cpath d='M8 0 13 8 8 16 3 8Z' fill='%2340d040'/%3E%3Cpath d='M8 0 8 16 3 8Z' fill='%23189818'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main class="stage" id="stage">
    <div class="gba" id="gba">
      <button class="shoulder sh-l" data-btn="L" aria-label="L 键">L</button>
      <button class="shoulder sh-r" data-btn="R" aria-label="R 键">R</button>

      <div class="left-pad">
        <div class="dpad" id="dpad" aria-label="方向键">
          <span class="dp dp-up" data-btn="up"></span>
          <span class="dp dp-down" data-btn="down"></span>
          <span class="dp dp-left" data-btn="left"></span>
          <span class="dp dp-right" data-btn="right"></span>
          <span class="dp-center"></span>
        </div>
      </div>

      <div class="screen-wrap">
        <div class="bezel">
          <div class="bezel-top"><span class="power" id="power"></span><span class="bezel-label">GAME BOY ADVANCE&nbsp;·&nbsp;像素人生</span></div>
          <div class="lcd" id="lcd">
            <canvas id="screen" width="240" height="160"></canvas>
          </div>
        </div>
      </div>

      <div class="right-pad">
        <div class="ab">
          <button class="round btn-b" data-btn="B" aria-label="B 键">B</button>
          <button class="round btn-a" data-btn="A" aria-label="A 键">A</button>
        </div>
      </div>

      <div class="sys">
        <button class="pill" data-btn="SELECT" aria-label="SELECT">SELECT</button>
        <button class="pill" data-btn="START" aria-label="START">START</button>
      </div>
      <div class="speaker"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <p class="hint" id="hint">方向键/WASD 移动 · Z/J/空格=A · X/K=B · 回车=START · Shift=SELECT · Q/E=L/R · M 静音</p>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
